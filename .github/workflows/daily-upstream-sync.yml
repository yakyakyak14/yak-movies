name: Daily Upstream Sync

on:
  schedule:
    - cron: '0 4 * * *'  # Daily at 04:00 UTC
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "yakyakyak14"
          git config user.email "yakyakyak1414@gmail.com"

      - name: Fetch Upstream
        run: |
          git remote add upstream https://github.com/mesamirh/MovieBox-Tui.git || true
          git fetch upstream main

      - name: Check for new commits
        id: check_upstream
        run: |
          UPSTREAM_HASH=$(git rev-parse upstream/main)
          echo "Upstream main commit: $UPSTREAM_HASH"
          # Check if upstream commit is already merged
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "Upstream has new commits!"
            echo "has_updates=true" >> $GITHUB_OUTPUT
          fi

      - name: Merge Upstream Changes
        if: steps.check_upstream.outputs.has_updates == 'true'
        run: |
          git merge -m "Sync: Merge upstream source updates" upstream/main --allow-unrelated-histories || {
            echo "Conflict detected, preserving YAK-MOVIES customizations..."
            git checkout --ours Cargo.toml src/config.rs src/main.rs src/net.rs src/tui/app/run.rs src/tui/screens/home.rs
            git add Cargo.toml src/config.rs src/main.rs src/net.rs src/tui/app/run.rs src/tui/screens/home.rs
            git commit -m "Resolve conflicts: retain YAK-MOVIES branding and responsive layout"
          }

      - name: Setup Rust
        if: steps.check_upstream.outputs.has_updates == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Build
        if: steps.check_upstream.outputs.has_updates == 'true'
        run: cargo check

      - name: Push updates
        if: steps.check_upstream.outputs.has_updates == 'true'
        run: git push origin main
